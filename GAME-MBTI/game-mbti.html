e:1},{text:"列了利弊清单，把风险都写出来，选那个让自己后悔最少的选项",score:-1},{text:"设了一个「如果X条件成立就去做」的判断标准，条件到了就执行，不再犹豫",score:-2}]},{id:8,dimension:"A",scenario:"深夜你正在加班，朋友发来消息，说遇到了很烂的事，字里行间都是情绪。你的第一反应是？",options:[{text:"先问「你现在方便打电话吗」，感受比方案重要，我要先陪着她",score:2},{text:"认真回复，然后不知不觉自己也陷进去了，一起气了半小时",score:1},{text:"听她说完，然后开始帮她分析事情的来龙去脉和可能的处理方法",score:-1},{text:"先共情两句让她稳住，然后悄悄开始帮她想下一步怎么处理",score:-2}]},{id:9,dimension:"M",scenario:"同事下午找你说：「这周五我有点事，你能帮我cover一下吗？」但你那天其实约了自己的事。你的反应一般是？",options:[{text:"「好，没事」——嘴已经说出去了，脑子还没反应过来",score:2},{text:"「好」——然后默默在心里把自己骂了一顿，为什么又答应了",score:1},{text:"先问了她什么事、工作量大不大，评估完再决定说不说得了",score:-1},{text:"「那天不行，下周可以」——说完感觉很正常，朋友也没觉得有问题",score:-2}]},{id:10,dimension:"M",scenario:"刷社交媒体的时候，看到一条基于明显偏见的内容，冒犯到你了。你会？",options:[{text:"当时没反应过来，刷过去了，但睡前躺在床上把那条内容反驳了整整二十分钟",score:2},{text:"心里不舒服，默默点不感兴趣然后拉黑，不想给这种内容流量",score:1},{text:"心里很不爽，但不会主动指出，如果已经有人冲上去了，会立刻开团跟上",score:-1},{text:"直接指出并反击，今天就让你知道花儿为什么这么红",score:-2}]},{id:11,dimension:"M",scenario:"朋友拉你去一个你完全不感兴趣的局，说「大家都来，就差你了」。你会？",options:[{text:"去了，坐在角落刷手机，但她开心就好",score:2},{text:"想找个借口但想不出来，最后还是去了，去了又后悔",score:1},{text:"说了「我对这种局不太来电，下次我们单独约？」",score:-1},{text:"「不去」，两个字，朋友也懂的",score:-2}]},{id:12,dimension:"M",scenario:"和室友合住，她习惯拿你的东西不打招呼，充电线、洗发水，偶尔还有零食。你的处理方式是？",options:[{text:"算了，都是小事，计较感觉太小气",score:2},{text:"心里已经有点情绪积累了，但真的开不了口，只能在内心默默记账",score:1},{text:"找了个轻松的时机说了一下，用的是「以后可以跟我说一声」而不是指责",score:-1},{text:"直接说了：「我的东西用之前打个招呼」，说完该干嘛干嘛，不尴尬",score:-2}]},{id:13,dimension:"E",scenario:"发工资了。钱到账的那一刻，你最真实的反应是？",options:[{text:"打开购物车，这个月终于可以把上个月没买的都结了",score:2},{text:"怎么花完全没计划，但是会先奖励自己一顿好吃的，这是每月的精神结算",score:1},{text:"先转一笔到不常用的账户，眼不见心不乱，剩下的才是能花的",score:-1},{text:"打开记账app，这个月的预算已经分好了，执行就行",score:-2}]},{id:14,dimension:"E",scenario:"你看上一个东西，很喜欢，但超出你心理预算30%。你会怎么处理？",options:[{text:"买，喜欢就是最充分的理由，人生苦短",score:2},{text:"去找平替，找了两小时没找到，说服自己「原版才是性价比」，买了",score:1},{text:"先放进购物车，等一个月，如果还是很想要，那就是真爱",score:-1},{text:"超预算就不考虑，等下次有余裕的时候再说，大概率就忘了",score:-2}]},{id:15,dimension:"E",scenario:"月底打开账单，你的第一反应是？",options:[{text:"笑死其实根本不看，偶尔看也是「啊，又超了。」然后关掉app，下个月再说 6B6B",rarity:"COMMON",insights:{behavior:{title:"性格行为",body:"你是那种会在群里@所有人庆祝同事生日、记得每个人喜欢什么咖啡的人。情绪感知力极强，能在别人开口前就察觉到气氛不对。但正因为如此，你也容易把别人的情绪揽到自己身上，下班之后还在复盘「她今天是不是不开心了」。消费对你来说是情绪的出口——高兴要庆祝，委屈要犒劳，本质上花的都是感受的钱。"},philosophy:{title:"生活哲学",body:"「活在当下」不是口号，是你真实的操作系统。你相信关系是最重要的资产，宁愿把钱花在一顿好饭、一次说走就走上，也不愿意存着等一个模糊的「以后」。你的逻辑是：人生随时可能重置，所以现在的每一个值得，都要认真对待。问题是月底账单会提醒你，情绪消费的账还是要还的。"},communication:{title:"日常沟通",body:"你是天然的氛围制造机，回复消息永远带表情包，开会时第一个暖场。但你很难拒绝别人，哪怕内心已经很疲惫，嘴上还是会说「没事我来」。需要注意：你的「好的没问题」有时候是真心，有时候是不想让对方难堪——但对方分不清楚，长期下来你会越来越累。"},career:{title:"事业发展",body:"你在团队里是凝聚力的来源，适合任何需要跨部门协作、客户关系维护的岗位。但你最大的职业风险是「做了很多、看见很少」——因为你太擅长填坑，容易被当成理所当然的托底。建议你开始有意识地留存自己的贡献记录，同时练习把「我帮你做了」转化为「我主导了」的表达。"}}},JEAS:{code:"JEAS",image:"images/sleeper.png",name:"SLEEPER",subtitle:"Sleeper = 卧底高手，外表平平无奇，实则暗藏实力",tagline:"温柔是你的皮，存款是你的底",description:"对谁都好说话，记账本却记得一丝不苟。帮了所有人的忙，却从来不说自己有多努力。柔软从来不是因为软弱，是因为有底气，底气叫存款。",tags:["温柔","暗藏底牌","以退为进"],color:"#A8E6CF",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你看起来是最好说话的那个，但没有人知道你脑子里有多清醒。你会认真倾听每一个人，也会默默观察每一个细节。情绪丰富但极少暴露——不是压抑，而是你觉得没必要让所有人都看见你的内心账本。你的温柔是真实的，但同时你也在悄悄评估：这段关系、这份付出，值不值得。"},philosophy:{title:"生活哲学",body:"你信奉「软实力是护城河」。你相信长期稳定比短期爆发更有价值，所以选择了最难被看见但最难被替代的路：把人做好，把钱存好，慢慢建立一个别人看不见但自己随时可以动用的安全网。你的快乐不来自被夸，来自打开那个存款账户时的那种平静感。"},communication:{title:"日常沟通",body:"你是最好的倾听者，也是最难被真正了解的人。你擅长把话说得让对方舒服，但很少把真实的想法全盘托出。当你真的开口说一件重要的事，往往意味着你已经想清楚很久了。需要留意：你的「没事」有时候真的没事，有时候是「有事但我懒得解释了」——偶尔主动说清楚，会省掉很多误解成本。"},career:{title:"事业发展",body:"你是那种三年后大家才后知后觉「她原来这么厉害」的类型。适合需要长期耕耘的赛道，比如专业技术积累、客户深度维护、品牌内容建设。最大的职业风险是：因为太低调，晋升机会被更会说话的人截走。建议你在保持风格的同时，学会在关键节点主动让结果「被看见」，多多“翻译你的成就”。"}}},JEBC:{code:"JEBC",image:"images/berserker.png",name:"BERSERKER",subtitle:"Berserker = 狂战士，爆发力极强，不计代价全力输出",tagline:"全力以赴，爽了就花，不算后账",description:"工作你是第一个冲上去的，下班你是第一个消失的。不讨好任何人，也不亏待自己。情感丰富，活得很烈，后果是明天的事。",tags:["爆发","边界","活得很烈"],color:"#FF8C42",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你活在高强度的情绪频率里，全力投入是你的默认模式。工作的时候你可以连续专注六小时，但一旦下班那条线划下去，任何工作消息都不存在。你对「喜欢」的事情执行力惊人，对「不喜欢」的事情则难以掩饰。情绪真实、边界清晰、消费直觉——你是典型的「活给自己看」人格，不太在意别人怎么解读你。"},philosophy:{title:"生活哲学",body:"你的哲学是：能量是有限的，要用在值得的地方。所以你在工作上卷，是因为你真的在乎结果；你在生活上花，是因为你认为体验本身有价值。你不做长期计划，不是因为没有远见，是因为你更相信「当下的全力以赴」会自然堆砌出一个好的未来。月底账单？下个月的事。"},communication:{title:"日常沟通",body:"你说话直接，表情管理基本为零。你不会因为「可能让对方不舒服」而憋着，但也不是故意伤人——你只是默认「大家都是成年人，应该能承受真话」。实际效果因人而异：欣赏你的人觉得你特别真实，接受不了的人会觉得你锋芒太露。建议偶尔在「直接」之前加一个缓冲帧，效果会好很多。"},career:{title:"事业发展",body:"你适合那种需要快速突破、强执行力的岗位——产品冲刺、销售、创业初期的核心角色。你的爆发力是真正的竞争优势，但持续性是你需要刻意训练的。建议找一个你真正认同价值观的方向深扎，否则你的能量会消耗在频繁转换赛道上。财务上建立一个「最低安全线」，让你的冒险有底气。"}}},JEBS:{code:"JEBS",image:"images/paladin.png",name:"PALADIN",subtitle:"Paladin = 圣骑士，不只是在打怪，是在为某个信仰而战",tagline:"你不是在卷，你是在为某个值得的东西攒血条",description:"比任何人都清楚自己在为什么战斗。全力投入工作，守住自己的边界，存的每一分钱背后都有一个具体的画面。有信仰的人，不容易被消耗。",tags:["信仰驱动","克制","押注未来"],color:"#FFD700",rarity:"RARE",insights:{behavior:{title:"性格行为",body:"你是那种内心装着一个具体目标的人——不是模糊的「过得好一点」，而是一个清晰的画面：那间工作室、那次旅行、那个不需要看日历的早晨。这个画面驱动着你，让你在工作上全力以赴，在生活上守住边界，在金钱上保持克制。你的情绪是真实且丰富的，但你不会轻易把它们消耗在不值得的地方。"},philosophy:{title:"生活哲学",body:"你相信「为了什么」比「做了什么」更重要。别人卷是因为焦虑，你卷是因为有方向；别人存钱是因为害怕，你存钱是因为有蓝图。这种以终为始的思维方式让你在大多数情况下不容易被焦虑操控。你最大的挑战是：当那个「值得的事」还没有到来时，如何维持当下的耐心和热情。"},communication:{title:"日常沟通",body:"你说话有立场，有温度，但也有边界。你不是冷漠，你只是不会把精力浪费在无意义的社交上。你的朋友圈小而稳固，每段关系都经过某种隐形的筛选。在工作场合，你可以非常投入和专业，但一旦下班，全球卫星也查无此人。对你来说，「我需要独处充电」不是借口，是维持系统稳定的必要操作。"},career:{title:"事业发展",body:"你是少数能把短期执行和长期规划都做好的类型。最适合你的是有清晰成长路径的赛道，或者允许你自己定义成功标准的角色（比如独立创作者、专业顾问、有自主权的产品线负责人）。需要警惕的是「信仰过载」——当目标过于沉重，反而容易产生对当下工作的疏离感。记得在路上给自己设几个小的庆祝节点。"}}},JRAC:{code:"JRAC",image:"images/merchant.png",name:"MERCHANT",subtitle:"Merchant = 商人，理性，反直觉，精于计算，擅长把复杂的问题转化为价值交换",tagline:"一切都有逻辑，一切逻辑最终指向消费",description:"人脉是资产，消费是投资，对人随和是因为关系是有效资源。最终还是花了，但消费前一定过了一遍ROI。理性月光的极致形态。",tags:["交换思维","算得清楚","理性月光"],color:"#C9B037",rarity:"COMMON",insights:{behavior:{title:"性格行为",body:"你对世界有一套隐形的估值系统。你不吝啬，但每一笔支出都经过某种快速的成本收益换算——这顿饭能不能带来更好的合作关系？这个课程能不能在简历上加分？这不代表你功利，只代表你的大脑自动把一切折算成资源效率。你对人随和，是因为你真心觉得「维护关系是有效投资」——只是有时候别人感受到了这层算法，会有点不自在。"},philosophy:{title:"生活哲学",body:"你的人生哲学是「配置优化」。你相信聪明地分配资源，比盲目努力更有效率。消费体验本身对你来说是有价值的——「这顿饭我学到了什么」「这次旅行开阔了什么视野」，这不是自我欺骗，是你真实的消费动机。问题在于这套逻辑可以为几乎任何消费行为背书，所以你的钱总是花得很有道理，但也花得很干净。"},communication:{title:"日常沟通",body:"你说话清晰、有条理，擅长把复杂的事情简化成「对你有什么好处」。这让你在谈判、说服、推进合作时效率极高。但在纯粹的情感交流里，这种「换算习惯」有时会让人觉得你不够真诚——对方想要的只是被倾听，而你已经在帮她分析解决方案了。建议偶尔关掉「顾问模式」，只是陪着就好。"},career:{title:"事业发展",body:"你天然适合商业、运营、项目管理、咨询类工作——任何需要「把事情做成」并且能清晰衡量结果的岗位。你的升职速度通常不慢，因为你懂得怎么让自己的价值被看见。最大的隐患是：当你的算法开始对自己运行，你会开始评估「这份工作的ROI够不够」——如果长期不够，你会越来越心不在焉。建议定期做一次真实的内部账。"}}},JRAS:{code:"JRAS",image:"images/grinder.png",name:"GRINDER",subtitle:"Grinder = 肝帝，靠重复积累碾压一切",tagline:"你的努力就是天赋一种",description:"勤勤恳恳，方法论执行精准，存款计划从不跑偏。外人眼里是老好人里最有规划的，自己知道每一步都在算。慢慢赢，但一定赢。",tags:["积累","复利人格","慢慢赢"],color:"#7EC8E3",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你是那种会把备忘录分类、把存钱计划设定自动转账、把健身打卡连续不断的人。你对「系统」有一种近乎本能的信任——你相信只要流程正确、坚持足够，结果一定会来。你不需要大起伏，稳定的推进感就能给你安全感。对人随和是真实的，但你的核心精力永远在自己的轨道上，不太容易被外部事件带偏。"},philosophy:{title:"生活哲学",body:"你深信复利定律，不只是金融意义上的，还有技能、关系、习惯。你愿意做那些「今天看不出差别、五年后差距巨大」的事。你不焦虑，不是因为不在意未来，是因为你每天都在朝着那个方向走，没有什么需要担心的。你对「快」不感冒——你见过太多冲得快、垮得也快的案例，你选择慢慢赢。"},communication:{title:"日常沟通",body:"你是可靠的那个人，说了就算，答应了就做。你不爱说大话，但你说的每句话都有分量，因为大家知道你会兑现。你的沟通风格偏务实，不太会花时间在情绪渲染上——有时候这会让亲近的人觉得你「不够热情」。建议偶尔在效率之外，给关系加一点不带目的的温度。"},career:{title:"事业发展",body:"你是长跑型选手，适合需要深度积累的领域。技术、研究、品牌、专业服务——任何「时间是朋友」的赛道都是你的主场。你的职业天花板通常比别人预估的高，因为你有别人没有的耐心。需要注意的是：不要因为擅长执行，就一直停留在执行层——你也有战略思维，需要主动争取展示的机会。"}}},JRBC:{code:"JRBC",image:"images/boss.png",name:"BOSS",subtitle:"Boss = 最终关卡，不需要被喜欢，只需要被记住",tagline:"不解释，不讨好，只交付结果",description:"有框架，有边界，花钱也有系统。最接近「精英感」的类型，本人也知道。然后去买喜欢的东西。",tags:["结果导向","不解释","高冷消费"],color:"#E040FB",rarity:"RARE",insights:{behavior:{title:"性格行为",body:"你对自己有清晰的定位，对工作有严格的标准，对时间有近乎苛刻的管理。你不是冷漠，你只是不把精力放在「管理他人感受」上——你认为交付结果才是最大的尊重。你的消费观也一样理性：买就买好的，不买就不买，不凑合，不将就。你会研究、比价、然后为真正认可的东西毫不犹豫地付钱。"},philosophy:{title:"生活哲学",body:"你相信结构和系统能解决大多数问题。你有自己的一套原则，它让你在面对复杂情况时不需要每次都重新权衡——规则到了，执行就是了。你对「被喜欢」的需求比大多数人低，但对「被尊重」的需求很高。你的生活美学是：少而精，有设计感，不解释。"},communication:{title:"日常沟通",body:"你说话信息密度极高，不废话，不绕弯子。在工作场合这是绝对的优势——高效、清晰、节省所有人的时间。但在私人关系里，这种风格会让人觉得你「难以靠近」。你不是不愿意亲密，只是你表达关心的方式可能是「帮你把问题解决掉」而不是「陪你坐在那里感同身受」。了解你的人知道这是爱，不了解的人会觉得你冷。"},career:{title:"事业发展",body:"你天生适合高度自主的角色——独立负责一条业务线、担任专业顾问、或者自己创业。你的执行力和框架感让你在混乱环境中特别有价值。需要注意的是：随着职级提升，你的核心工作会越来越是「通过影响他人来交付结果」，而不是自己直接做——你需要刻意练习「让别人赢」的能力，而不只是自己赢。"}}},JRBS:{code:"JRBS",image:"images/rtaer.png",name:"RTAer",subtitle:"RTA（Real Time Attack）= 从按下开始到通关，用现实时间计算的速通跑法",tagline:"别人在刷副本，你在推主线",description:"你比任何人都早想清楚——打工的终点不是升职，是退出。不内耗规则，只优化路线。有方法，有边界，有余粮。五年后你不一定最有名，但最可能不需要打工。",tags:["出口导向","复利","不被游戏消耗"],color:"#00FF88",rarity:"LEGENDARY",insights:{behavior:{title:"性格行为",body:"你可能是16型里最早「看穿游戏规则」的人。你认真工作，但不是因为认同这套系统——你是在用系统的资源完成自己的目标。你的行动高效、情绪稳定、边界清晰，不是因为你冷漠，是因为你有一张只有自己看得见的地图，知道自己在往哪里走，不需要在路上处理太多噪音。存款对你来说不是安全感，是选择权。"},philosophy:{title:"生活哲学",body:"你的人生哲学用一句话概括：「打工是手段，不是目的。」你相信时间才是最稀缺的资源，而大多数人是用时间换钱，你想要的是用钱换回时间。这套逻辑让你在做每一个决策时都比别人多看一层：这件事会让我更快达到目标，还是会让我陷在这个系统里更久？"},communication:{title:"日常沟通",body:"你说话简洁、有逻辑、少废话。你的沟通是目标导向的——有需要处理的事情，处理完就好。你不太参与办公室政治，也不喜欢无意义的闲聊，但你在需要的时候可以非常专业且有说服力。你的边界在沟通里体现得很明显：下班后基本断联，周末不谈工作——不是态度问题，是系统设置。"},career:{title:"事业发展",body:"你最适合的职业路径是那些有明确「资产积累」属性的赛道：技术能力变现、内容创作、投资、顾问——任何可以把专业能力转化为被动收入的方向。你不应该在一个需要你无限付出时间的地方停留太久，除非那段时间是在换取一个更大的出口。你的职业终局可能不是「退休」，而是「完全为自己工作」。"}}},LEAC:{code:"LEAC",image:"images/rarenpc.png",name:"RNPC",subtitle:"Rare NPC = 低概率触发的隐藏角色，没有任务标记，遇到就是运气",tagline:"世界在卷，你在给路过的玩家发糖",description:"你不在主线上，也不在任何人的攻略里。随遇而安，对谁都好，钱包常常见底，但你不觉得这是问题。可能是16型里活得最当下的，也是最难被系统理解的。",tags:["当下","稀有善意","无攻略"],color:"#FF9ECD",rarity:"RARE",insights:{behavior:{title:"性格行为",body:"你是那种会在便利店跟收银员闲聊两句、看到流浪猫会停下来的人。你的善意是散漫的、真实的、不计回报的。你不按剧本走，也不在意别人是否在看——你只是在做当下觉得对的事。这种状态让你走到哪里都能交到朋友，但也让你很难在需要「战略推进」的环境里待久。"},philosophy:{title:"生活哲学",body:"你对「意义」的定义非常当下：这一刻是不是真实的、是不是有温度的、是不是我想要的——比任何长期规划都重要。你不是没有想法，只是你不愿意为了一个模糊的未来牺牲现在真实的感受。钱花光了不慌，因为你的经验告诉你：下一笔总会来的，而且那顿饭、那个下午、那段聊天，真的值。"},communication:{title:"日常沟通",body:"你是最没有防备心的那个，说话真实，眼神真诚，很难让人不喜欢你。你不太会说场面话，也不太会管理信息——你说的都是真心话，有时候这会让一些人觉得你太随意。你最擅长的是创造那种「莫名其妙就很放松」的氛围——不需要做什么，你在那里就够了。"},career:{title:"事业发展",body:"传统的职业晋升通道对你来说往往不太好走，因为你不擅长把自己的价值「包装」成系统可以识别的格式。但你在非线性的、关系驱动的领域往往能走得很远——社群运营、文化创意、心理咨询、自由职业者。建议你找到一个允许你「做自己」就有价值的赛道，然后在财务上建立最基础的缓冲，给你的随性留一个安全垫。"}}},LEAS:{code:"LEAS",image:"images/innkeeper.png",name:"INNKEEPER",subtitle:"Innkeeper = 客栈老板，热情待客，暗中经营自己的账本",tagline:"谁来都欢迎，谁走都不留",description:"表面最软，私下账本只有自己看。温柔有底牌，随和不随便，偶尔一句「我有存款」让人大跌眼镜。静水深流，以柔克刚。",tags:["藏而不露","静水深流","以柔克刚"],color:"#FFCC80",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你是那种让人一见如故、再见还想见的人。你有天然的接纳感，不评判，不说教，任何人来了都能在你这里放松下来。但你有一个只有自己才知道的「内核」——你的底线、你的计划、你的账本，都不轻易让外人看见。你的随和是真实的，但绝不是没有立场。见过你「亮底牌」的人通常都会愣一下。"},philosophy:{title:"生活哲学",body:"你的人生哲学是「软着陆」。你不喜欢正面冲突，但你有非常稳固的内在结构——有存款，有计划，有自己的节奏。你相信温柔是最有效率的通行证，绝大多数门，好好说话都能开。你的幸福感来自那种「一切在掌控之中，而且感觉还不错」的平静状态。"},communication:{title:"日常沟通",body:"你是天然的连接者，能让不同类型的人在同一个场合都感到自在。你说话不尖锐，但有分量；你不主动冲突，但遇到真正的底线会非常清晰地表达。你的沟通策略是「先让对方舒服，然后才推进事情」——这在大多数场合是非常有效的，但在需要快速决策的时候会显得慢。"},career:{title:"事业发展",body:"你适合任何需要长期关系维护和信任建立的岗位——客户成功、品牌公关、团队管理、社区运营。你的升职路径通常不靠爆发，靠积累的口碑。需要注意的是：你的「好说话」有时候会让你承接过多不属于你的工作，而且你不太擅长主动要求回报。建议把「我做了什么」定期转化为「我应该得到什么」，这一步不要省。"}}},LEBC:{code:"LEBC",image:"images/sandbox.png",name:"SANDBOX",subtitle:"Sandbox = 沙盒模式，没有主线任务，只有自由探索",tagline:"没有主线，只有当下觉得爽的事",description:"守护自己的空间，情感丰富，对喜欢的东西毫不手软。生活要有质感，明天的事明天再说。不交代任何人，自由是唯一的通关条件。",tags:["自由模式","当下质感","不交代任何人"],color:"#80DEEA",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你是一个感官型的人，对「好的体验」非常敏感——好的咖啡、好的光线、好的音乐、好的氛围，这些对你来说不是加分项，是基础配置。你有清晰的边界，不是因为冷漠，是因为你对自己的时间和空间有很高的自主需求。不想去的局不去，不想接的电话不接，这不是任性，这是你维持状态的方式。"},philosophy:{title:"生活哲学",body:"你相信生活本身就是目的，不是通往某个终点的路。你对「有意义的体验」的重视程度远超「有效率的积累」——这不代表你没有追求，只是你的追求是在感受的维度上的。你不怕漂移，因为你相信只要自己当下是真实的、投入的，就不会走错。"},communication:{title:"日常沟通",body:"你的表达方式非常有个人风格——用词独特，有画面感，不按套路走。你不喜欢废话连篇的会议，也不喜欢「为了维持关系」的应酬，但对真正有共鸣的对话你可以聊到凌晨三点。你的边界在沟通里体现得很直接：不感兴趣的话题会明显失去兴趣，不用心解读你的人很快就会掉线。"},career:{title:"事业发展",body:"你在有创作空间的岗位上会表现得远超预期：视觉设计、内容创作、用户体验、独立策划。你最难受的状态是被要求「照流程走」而没有任何发挥空间。建议你认真对待财务规划，不是为了压抑自己，而是为了在你想说「不」的时候有底气说。稳定的现金储备是你自由的基础设施。"}}},LEBS:{code:"LEBS",image:"images/wanderer.png",name:"WANDERER",subtitle:"Wanderer = 流浪者，随机游走，但心里有一张只有自己看得懂的地图",tagline:"看起来漫无目的，其实在等一件值得的事",description:"存钱不是因为焦虑，是因为那个梦要钱才能实现。16型里最有诗意的躺平。慢慢靠近，总有一天会抵达那个只有自己知道的地方。",tags:["内在地图","为梦储蓄","慢慢靠近"],color:"#CE93D8",rarity:"RARE",insights:{behavior:{title:"性格行为",body:"你看起来是在漂，但你其实有一套只有自己才读得懂的内在导航。你的行动不符合外部标准，却高度符合你自己的节奏。你感情真挚，但边界清晰——你不会为了「让别人安心」而扭曲自己的方向。存钱对你来说不是焦虑的产物，是为那个还没说出口的计划悄悄备好的粮草。"},philosophy:{title:"生活哲学",body:"你相信每个人都有一条属于自己的路，而那条路不在任何攻略里。你不着急，不是因为没有方向，是因为你知道「时机」这件事急不来。你愿意等，愿意积累，愿意在别人看不懂的地方默默做准备。你的幸福感来自内部，不来自外部的认可——这既是你的力量，也是你最容易被误解的地方。"},communication:{title:"日常沟通",body:"你是那种「平时不声不响，突然说一句让人愣住」的类型。你的表达往往有很强的个人色彩，不按套路，但有一种说不清楚的准确性。你不爱解释，也不爱说服，你只是说你认为真实的，然后由对方自己判断。这让你在一些人眼里「神秘」，在另一些人眼里「难懂」。"},career:{title:"事业发展",body:"你不适合流水线式的工作环境，但在给你足够自主权的地方，你往往会走出一条让人意外的路。独立研究者、自由撰稿人、某个小而深的垂直领域的专家——任何允许你「用自己的方式定义成功」的赛道。建议你不要因为「看起来在漂」而内疚，只需要确保你悄悄攒的那笔钱真的在增长，给那个等待中的目标留着。"}}},LRAC:{code:"LRAC",image:"images/pacifist.png",name:"PACIFIST%",subtitle:"Pacifist% = 全程零伤害通关跑法，不攻击任何敌人也能过关",tagline:"反内卷发言人，且说得无懈可击",description:"不得罪任何人，用理性证明躺平是可行解。有一套完整的「为什么不需要卷」理论，消费也能自圆其说——「体验是资产」。",tags:["非暴力通关","躺平有理论","零摩擦"],color:"#A5D6A7",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你是那种能用逻辑说服自己和别人「不卷也能赢」的人，而且你有一套真实自洽的理论体系支撑这个立场。你对人随和，摩擦成本极低，有一种让人自然放松的气质。你的消费是感性和理性的混合：体验本身值得，而且你能给出一个让自己信服的理由——这不是自我欺骗，是一种真实的价值观。"},philosophy:{title:"生活哲学",body:"你的核心哲学是「不对抗，绕过去」。你不觉得需要赢过任何人，你只需要找到一条让自己舒服的路径。你有足够的理性评估风险，有足够的随和让自己在大多数环境里不产生摩擦，这让你的生活成本（情绪成本、社交成本）极低。你最大的智慧是：你不参与那些你认为没有意义的战役。"},communication:{title:"日常沟通",body:"你说话有条理，不带刺，很难让人讨厌。你擅长在分歧时找到「我们都能接受的答案」，不是因为你没有立场，是因为你认为对抗的成本大于收益。你最擅长的是那种「在散漫的聊天里突然说出一句很有分量的话」——让人回味半天。"},career:{title:"事业发展",body:"你适合那些「把事做成但不需要你打硬仗」的角色——协调者、分析师、顾问、研究员。你在需要软性推进的项目里往往比硬碰硬的人更有效率。需要注意的是：你的「零摩擦」策略在需要快速拍板、强硬推进的关键时刻可能会成为短板。建议你找几个可以练习「温和但坚定地坚持」的低风险场合，逐步建立这种肌肉记忆。"}}},LRAS:{code:"LRAS",image:"images/newgame.png",name:"NEW GAME+",subtitle:"New Game+ = 二周目，带着上一局的经验重新开始，更从容",tagline:"经历过，算清楚了，这次不慌",description:"理性选择躺平，不是因为懒，是因为算过了。悄悄执行一个只有自己知道的长期计划。可能是FIRE预备队。",tags:["二周目心态","从容积累","早就想清楚了"],color:"#80CBC4",rarity:"RARE",insights:{behavior:{title:"性格行为",body:"你有一种很难得的品质：你不容易被焦虑操控。不是因为你无感，是因为你已经把很多事情想得足够清楚了——「这件事最坏的结果是什么，我能接受吗？能。那就不用慌。」你对人随和但不随便，你的存款计划从不因为情绪波动而中断。在别人眼里，你显得异常稳定，甚至有点冷静得不像这个时代的人。"},philosophy:{title:"生活哲学",body:"你是那种真正理解「人生是长跑」的人——不只是当口号喊，是真的按这个框架做决策。你不在意某个月的结果，你在意的是五年的方向对不对。你选择躺平，是因为你计算过：用同样的时间精力，这条路比卷更快到达你想去的地方。这是理性，不是懈怠。"},communication:{title:"日常沟通",body:"你说话不多，但质量高。你不参与无意义的争论，也不需要说服所有人认同你的选择——你自己清楚就够了。当你开口给建议，往往让人觉得「她怎么把这件事看得这么清楚」。你最容易被人误解的地方是：你的平静有时会被解读为「不在乎」，但你只是不需要用情绪证明自己在乎。"},career:{title:"事业发展",body:"你可能是最接近「主动设计职业路径」而不是「被职业路径推着走」的类型。你会在某个时间点做出一个让外人看起来「很冒险」的决定，但你内部其实算了很久了。适合你的赛道：任何有复利属性的领域——投资、专业积累型职业、内容创作。长期来看，你是16型里最可能在40岁之前实现财务自由的类型。"}}},LRBC:{code:"LRBC",image:"images/explorer.png",name:"EXPLORER",subtitle:"Explorer = 探索者，地图要点亮，钱是探索的燃料",tagline:"没有终点，只有下一个地方",description:"边界是路线，不卷有逻辑，消费有系统。可能是某种生活方式的信奉者——极简或slow living，但会重金买一件「值得的东西」。",tags:["生活方式驱动","战略消费","地图玩家"],color:"#FFA726",rarity:"UNCOMMON",insights:{behavior:{title:"性格行为",body:"你有一种「活得很有品位但不装」的气质。你研究自己喜欢什么，然后为那些东西建立一套自己的评价体系。你的边界是路线图：这条路走，那条路不走，不是随机的，是有逻辑的选择。你对人不冷漠，但不会为了社交而社交；你花钱不冲动，但对真正值得的东西毫不手软。"},philosophy:{title:"生活哲学",body:"你的终极问题不是「我怎么赢」，而是「我想要什么样的生活」。你在乎生活的质感，在乎探索的密度，在乎每一段经历是不是真的丰富了你。不卷不是因为懒，是因为你清楚地知道「卷」不在你的人生地图上。消费对你来说是探索的成本，你愿意付，但你希望每一笔都花在值得的目的地上。"},communication:{title:"日常沟通",body:"你是那种聊起感兴趣的话题会突然很有能量的人，但对不感兴趣的事会明显掉线。你的表达有自己的色彩，不套公式，有时候会让人觉得「你好像活在另一个频道」——但真正跟上你的人会发现那个频道特别有意思。你的边界在沟通里清晰可见：不愿意聊的事不解释，不喜欢的圈子不强融。"},career:{title:"事业发展",body:"你在传统升职路径上往往不走直线，但你会在某个垂直领域里形成真正有深度的积累。生活方式博主、旅行策划、体验设计、某个细分领域的独立研究者——任何能把你对「探索」的热情转化为价值的方向。建议你认真对待消费系统的设计，不是为了压缩体验，而是让有限的资金能支撑最大密度的探索。"}}},LRBS:{code:"LRBS",image:"images/ghost.png",name:"GHOST%",subtitle:"Ghost% = 幽灵速通跑法，全程不被任何敌人发现",tagline:"全程不被系统发现，悄悄把筹码攒够，然后消失",description:"存在感最低，内心最稳。不需要被看见，不需要被理解，也不需要卷。职场里的幽灵，但绝不是弱者。等待离场。",tags:["隐身","不参与游戏","等待离场"],color:"#B0BEC5",rarity:"LEGENDARY",insights:{behavior:{title:"性格行为",body:"你是职场里最低存在感，同时内心世界最完整的那个人。你不需要被看见，不需要被认可，你有一套完全自洽的内在系统。你观察一切，分析一切，但极少介入。你的不参与不是冷漠，是一种主动的选择——你在评估这场游戏之后，决定不浪费能量在你认为没有意义的事情上。你的存款在悄悄增长，你的计划在悄悄推进，你在等一个只有你自己知道的时间点。"},philosophy:{title:"生活哲学",body:"你可能是16型里对「自由」理解最深的人——不是那种需要被展示的自由，而是真正的「不依赖系统就能运转」的自由。你在积累离场的筹码，而且你不急，因为你知道急没有用，复利需要时间。你不在意别人怎么看这个过程，你只在意终点的那个状态。你的人生哲学是：最高效的胜利是让对手以为你不在场。"},communication:{title:"日常沟通",body:"你说话极少，但极准。你不参与闲聊，不回应无意义的争论，但在真正重要的时刻，你说出的话往往让人觉得「她早就看清楚了」。你最难被理解的地方是：你的沉默不代表认同，也不代表软弱——你只是在等一个值得开口的时刻。认识你越深的人，越会意识到你一直都在，只是不说。"},career:{title:"事业发展",body:"你在职场里的目标不是往上爬，是「把这个阶段要换取的东西换到手，然后离开」。你适合那些技能有高度可迁移性的岗位，因为你的终局不是在这家公司成为核心，而是积累可以带走的能力和资本。建议你在职业规划上比任何人都更早考虑「出口」：什么时候积累够了？离开之后去哪里？那个「哪里」准备好了吗？"}}}},v={COMMON:{label:"COMMON",color:"#999"},UNCOMMON:{label:"UNCOMMON",color:"#4CAF50"},RARE:{label:"RARE",color:"#2196F3"},LEGENDARY:{label:"LEGENDARY",color:"#FFD700"}},x={G:{pos:"卷",neg:"躺",color:"#FF6B6B"},A:{pos:"情",neg:"理",color:"#FFD700"},M:{pos:"宜人",neg:"边界",color:"#00FF88"},E:{pos:"消费",neg:"储蓄",color:"#7EC8E3"}},k="!@#$%?ABCDEFGHIJKLMNOP&*[]",w={behavior:"◈",philosophy:"◎",communication:"◉",career:"◆"},S=["behavior","philosophy","communication","career"];function E({score:e,color:t,pos:n,neg:r}){let l=(e+8)/16*100;return(0,i.jsxs)("div",{className:"flex items-center gap-3",children:[(0,i.jsx)("span",{className:"text-[#444] text-[10px] w-7 text-right shrink-0",children:r}),(0,i.jsxs)("div",{className:"flex-1 h-1 bg-[#151515] relative",children:[(0,i.jsx)("div",{className:"absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-px h-3 bg-[#2a2a2a]"}),(0,i.jsx)("div",{className:"absolute top-0 h-full transition-all duration-700 ease-out",style:{left:l<50?`${l}%`:"50%",width:`${Math.abs(l-50)}%`,backgroundColor:t}})]}),(0,i.jsx)("span",{className:"text-[#444] text-[10px] w-7 shrink-0",children:n})]})}function N({label:e,icon:t,active:n,color:r,onClick:l}){return(0,i.jsxs)("button",{onClick:l,className:"flex-1 flex flex-col items-center gap-1 py-2.5 transition-all duration-200 border-b-2",style:{borderBottomColor:n?r:"transparent",color:n?r:"#666"},children:[(0,i.jsx)("span",{className:"text-sm",children:t}),(0,i.jsx)("span",{style:{fontSize
